; Example config for nano-prom-exporter.
; Pass it with:  nano-prom --config_path /path/to/config.ini
;
; A config file is only needed to push to more than one gateway or to use
; HTTP basic auth. With a config file, [DEFAULT] values override the CLI flags.

[DEFAULT]
rpcIp = localhost
rpcPort = 7076
nodeDataPath = ~/Nano
hostname = testing
interval = 10

; Each non-DEFAULT section is a push gateway; the section name is its full URL.

; A gateway with no authentication.
[http://127.0.0.1:9091]

; A gateway using HTTP basic auth (password is required when username is set).
[http://127.0.0.1:9092]
username = test
password = testing
